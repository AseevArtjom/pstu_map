version: '3.8'

services:
  postgres_db:
    image: postgres:15
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-university_navigator}
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "${DB_PORT:-8083}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-university_navigator}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  flyway:
    image: flyway/flyway:10-alpine
    container_name: flyway_container
    restart: "no"
    command: -url=jdbc:postgresql://postgres_db:5432/${DB_NAME:-university_navigator} -user=${DB_USER:-postgres} -password=${DB_PASSWORD:-postgres} -baselineOnMigrate=true migrate
    volumes:
      - ./src/main/resources/db/migration:/flyway/sql
    depends_on:
      postgres_db:
        condition: service_healthy

volumes:
  postgres_data: